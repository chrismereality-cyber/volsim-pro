<!DOCTYPE html>
<html>
<head>
<title>VOLSIM PRO | LIVE</title>
<style>
body { background: #0b0f14; color: #00ffcc; font-family: monospace; padding: 20px; }
.status-box { border: 1px solid #00ffce; padding: 20px; border-radius: 5px; background: #161b22; }
</style>
</head>
<body>
<h1>VOLSIM PRO DASHBOARD</h1>
<div class="status-box">
<h2>ENGINE STATUS: <span id="status" style="color:red;">INITIALIZING...</span></h2>
<pre id="raw">Connecting to engine...</pre>
</div>
<script>
async function update() {
    try {
        const response = await fetch(`${window.location.origin}/api/data?t=${Date.now()}`);
        if (!response.ok) throw new Error('HTTP Error: ' + response.status);
        const json = await response.json();

        document.getElementById('status').textContent = 'ONLINE';
        document.getElementById('status').style.color = '#00ffce';
        document.getElementById('raw').textContent = JSON.stringify(json, null, 4);
    } catch (err) {
        document.getElementById('status').textContent = 'OFFLINE (' + err.message + ')';
        document.getElementById('status').style.color = 'red';
    }
}
setInterval(update, 2000);
update();
</script>
</body>
</html>
