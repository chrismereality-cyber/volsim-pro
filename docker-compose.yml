services:
  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
  
  volsim-api:
    build: .
    ports:
      - "10000:10000"
    environment:
      - REDIS_HOST=redis
      - PYTHONPATH=/app
    depends_on:
      - redis

  volsim-worker:
    build: .
    command: python /app/src/risk/risk_engine.py
    environment:
      - REDIS_HOST=redis
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    depends_on:
      - redis
