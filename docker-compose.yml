services:
  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  regime_engine:
    build: .
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

  execution_service:
    build: .
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
      - regime_engine

volumes:
  redis_data:
