version: "3.9"

services:
  db:
    image: postgres:15
    container_name: volsim-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - volsim-data:/var/lib/postgresql/data

  api:
    build: .
    container_name: volsim-api
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      PORT: ${PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    command: node index.js

volumes:
  volsim-data:
